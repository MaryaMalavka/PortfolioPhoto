<!DOCTYPE html>
<html lang="ru" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Загрузка…</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;800&family=Plus+Jakarta+Sans:wght@300;400;500;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            // hover-стили работают только на устройствах с мышью (на телефонах «залипания» нет)
            future: { hoverOnlyWhenSupported: true },
            theme: { extend: {
                fontFamily: { syne: ['Syne','sans-serif'], cinzel: ['Cinzel','serif'], sans: ['Plus Jakarta Sans','sans-serif'] },
                colors: { studio: { 50:'#f8f8f8', 100:'#e6e6e6', 900:'#0d0d0d', 950:'#050505' } }
            } }
        }
    </script>
    <style>
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0d0d0d; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #555; }
        section { scroll-margin-top: 76px; }
        .text-outline { -webkit-text-stroke: 1px rgba(255,255,255,0.25); color: transparent; }
        .text-outline:hover { -webkit-text-stroke: 1px rgba(255,255,255,0.9); color: transparent; }
        .editorial-border { border-color: rgba(255,255,255,0.12); }
        .bg-grain { background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.03'/%3E%3C/svg%3E"); }
        .no-scrollbar { scrollbar-width: none; -ms-overflow-style: none; }
        .no-scrollbar::-webkit-scrollbar { display: none; }

        /* Фото: на телефонах всегда в цвете и без эффектов.
           Ч/Б → цвет по наведению только там, где есть мышь. */
        .photo { transition: filter .7s ease, transform .7s ease; }
        @media (hover: hover) and (pointer: fine) {
            .photo { filter: grayscale(1); }
            .group:hover .photo { filter: none; transform: scale(1.05); }
        }
    </style>
</head>
<body class="bg-studio-950 text-studio-50 font-sans selection:bg-white selection:text-black bg-grain antialiased min-h-screen flex flex-col justify-between overflow-x-hidden">

    <!-- Header -->
    <header class="fixed top-0 left-0 right-0 z-40 bg-studio-950/80 backdrop-blur-md border-b editorial-border">
        <div class="max-w-7xl mx-auto px-6 py-5 flex justify-between items-center gap-4">
            <a href="#" class="font-syne text-xl tracking-tighter font-extrabold uppercase hover:opacity-70 transition">
                <span data-t="meta.brand"></span><span class="text-xs font-sans tracking-widest text-neutral-500 block font-normal" data-t="meta.brand_sub"></span>
            </a>
            <nav class="hidden md:flex items-center space-x-10 text-xs tracking-widest uppercase font-medium text-neutral-400">
                <a data-nav="gallery" href="#sec-gallery" class="hover:text-white transition">Галерея</a>
                <a data-nav="about" href="#sec-about" class="hover:text-white transition">Обо мне</a>
                <a data-nav="services" href="#sec-services" class="hover:text-white transition">Услуги</a>
                <a data-insta target="_blank" rel="noopener" class="hover:text-white transition flex items-center gap-1.5"><i data-lucide="instagram" class="w-3.5 h-3.5"></i> <span data-insta-handle></span></a>
            </nav>
            <button onclick="toggleContactModal()" class="inline-flex items-center justify-center px-5 py-2.5 text-xs font-semibold uppercase tracking-widest text-studio-950 bg-white rounded-full transition hover:bg-neutral-200">
                <span data-t="hero.book_button" data-d="Забронировать дату"></span>
            </button>
        </div>
    </header>

    <!-- Блоки сайта. Порядок и показ задаются в админке (раздел «Порядок и показ блоков») -->
    <main id="main" class="flex-1 pt-[76px]">

        <!-- Hero -->
        <section id="sec-hero" class="pt-16 pb-12 px-6 max-w-7xl mx-auto w-full">
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-end">
                <div class="lg:col-span-8">
                    <div id="hero-badge" class="inline-flex items-center gap-2 px-3 py-1 rounded-full border editorial-border text-xs font-mono text-emerald-400 mb-4 bg-emerald-500/10">
                        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                        <span data-t="hero.badge"></span>
                    </div>
                    <h1 class="font-syne text-4xl sm:text-7xl lg:text-8xl font-extrabold uppercase leading-[0.95] tracking-tight">
                        <span data-t="hero.first_name"></span> <br>
                        <span class="text-outline italic font-cinzel font-normal" data-t="hero.last_name"></span>
                    </h1>
                    <p class="mt-4 font-syne text-lg sm:text-2xl text-neutral-300 uppercase tracking-wide" data-t="hero.subtitle"></p>
                </div>
                <div class="lg:col-span-4 border-l editorial-border pl-6 py-2">
                    <p class="text-neutral-400 text-sm font-light leading-relaxed mb-6 whitespace-pre-line" data-t="hero.description"></p>
                    <div class="flex items-center gap-4 text-xs font-mono text-neutral-400">
                        <i data-lucide="map-pin" class="w-4 h-4 text-neutral-300"></i>
                        <span data-t="hero.location"></span>
                    </div>
                </div>
            </div>
        </section>

        <!-- Featured: 3 фото без подписей и ссылок -->
        <section id="sec-featured" class="px-6 pt-4 pb-20 max-w-7xl mx-auto w-full">
            <div id="featured" class="grid grid-cols-1 sm:grid-cols-3 gap-4"></div>
        </section>

        <!-- Instagram -->
        <section id="sec-instagram" class="py-12 border-y editorial-border bg-studio-900/40 backdrop-blur">
            <div class="max-w-7xl mx-auto px-6">
                <div class="flex flex-col md:flex-row items-center justify-between gap-6">
                    <div class="flex items-center gap-4">
                        <div data-imgwrap class="w-16 h-16 rounded-full p-0.5 bg-gradient-to-tr from-amber-500 via-rose-500 to-purple-600 shrink-0">
                            <img id="insta-avatar" alt="" class="w-full h-full rounded-full object-cover border-2 border-black">
                        </div>
                        <div>
                            <h4 class="font-syne font-bold text-lg flex items-center gap-2">
                                <i data-lucide="instagram" class="w-5 h-5"></i>
                                <span data-insta-handle></span>
                                <i data-lucide="badge-check" class="w-4 h-4 text-blue-400"></i>
                            </h4>
                            <p class="text-xs text-neutral-400 max-w-xl" data-t="instagram.bio"></p>
                        </div>
                    </div>
                    <a data-insta target="_blank" rel="noopener" class="bg-white text-black text-xs font-bold px-6 py-3 rounded-full uppercase tracking-wider hover:bg-neutral-200 transition shrink-0 flex items-center gap-2">
                        <i data-lucide="instagram" class="w-4 h-4"></i> <span data-t="instagram.button" data-d="Перейти в Instagram"></span>
                    </a>
                </div>
            </div>
        </section>

        <!-- Gallery -->
        <section id="sec-gallery" class="py-24 max-w-7xl mx-auto px-6 w-full">
            <div class="flex flex-col md:flex-row md:items-end justify-between mb-12 gap-6">
                <div>
                    <span class="text-xs font-mono uppercase tracking-[0.3em] text-neutral-400" data-t="headings.gallery_eyebrow" data-d="// ГАЛЕРЕЯ РАБОТ"></span>
                    <h2 class="font-syne text-4xl sm:text-5xl font-extrabold uppercase mt-2" data-t="headings.gallery_title" data-d="Портфолио"></h2>
                </div>
                <div id="filter-buttons" class="flex flex-wrap gap-2 text-xs font-mono"></div>
            </div>
            <div id="gallery-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
        </section>

        <!-- About -->
        <section id="sec-about" class="py-24 border-t editorial-border bg-studio-900/20">
            <div class="max-w-7xl mx-auto px-6">
                <div class="grid grid-cols-1 lg:grid-cols-12 gap-12 items-center">
                    <div data-imgwrap class="lg:col-span-5">
                        <div class="aspect-[4/5] rounded-xl overflow-hidden border editorial-border">
                            <img id="about-photo" alt="" class="w-full h-full object-cover">
                        </div>
                    </div>
                    <div class="lg:col-span-7">
                        <span class="text-xs font-mono uppercase tracking-[0.3em] text-neutral-400" data-t="headings.about_eyebrow" data-d="// ОБ АВТОРЕ"></span>
                        <h2 class="font-syne text-3xl sm:text-4xl font-bold uppercase mt-2 mb-6" data-t="about.title"></h2>
                        <div id="about-text" class="space-y-4 text-neutral-300 text-sm leading-relaxed"></div>
                        <div id="about-facts" class="grid grid-cols-2 sm:grid-cols-3 gap-6 mt-10 pt-8 border-t editorial-border"></div>
                    </div>
                </div>
            </div>
        </section>

        <!-- Services -->
        <section id="sec-services" class="py-24 max-w-7xl mx-auto px-6 w-full">
            <span class="text-xs font-mono uppercase tracking-[0.3em] text-neutral-400" data-t="headings.services_eyebrow" data-d="// СЪЕМКИ И ПРАЙС"></span>
            <h2 class="font-syne text-4xl font-extrabold uppercase mt-2 mb-12" data-t="headings.services_title" data-d="Услуги фотографа"></h2>
            <div id="services-list" class="divide-y editorial-border"></div>
        </section>

        <!-- Reviews: карусель-облачка -->
        <section id="sec-reviews" class="py-24 border-t editorial-border bg-studio-900/20">
            <div class="max-w-7xl mx-auto px-6">
                <div class="flex items-end justify-between gap-6 mb-10">
                    <div>
                        <span class="text-xs font-mono uppercase tracking-[0.3em] text-neutral-400" data-t="headings.reviews_eyebrow" data-d="// ОТЗЫВЫ"></span>
                        <h2 class="font-syne text-4xl font-extrabold uppercase mt-2" data-t="headings.reviews_title" data-d="Говорят клиенты"></h2>
                    </div>
                    <div id="rv-controls" class="flex gap-2 shrink-0">
                        <button type="button" onclick="rvScroll(-1)" aria-label="Назад" class="w-11 h-11 rounded-full border editorial-border flex items-center justify-center hover:bg-white hover:text-black transition"><i data-lucide="chevron-left" class="w-5 h-5"></i></button>
                        <button type="button" onclick="rvScroll(1)" aria-label="Вперёд" class="w-11 h-11 rounded-full border editorial-border flex items-center justify-center hover:bg-white hover:text-black transition"><i data-lucide="chevron-right" class="w-5 h-5"></i></button>
                    </div>
                </div>
                <div id="rv-track" class="flex gap-4 overflow-x-auto snap-x snap-mandatory scroll-pl-6 pb-2 -mx-6 px-6 no-scrollbar"></div>
            </div>
        </section>

        <!-- CTA -->
        <section id="sec-cta" class="relative overflow-hidden py-28 border-t editorial-border">
            <!-- Фоновое фото + затемнение (настраиваются в админке) -->
            <div id="cta-bg" class="absolute inset-0 hidden" aria-hidden="true">
                <img id="cta-img" alt="" class="w-full h-full object-cover">
                <div id="cta-shade" class="absolute inset-0"></div>
            </div>
            <div class="relative max-w-4xl mx-auto px-6 text-center">
                <h2 class="font-syne text-4xl sm:text-6xl font-extrabold uppercase leading-[0.98] tracking-tight" data-t="cta.title"></h2>
                <p id="cta-text" class="mt-6 text-neutral-400 text-sm sm:text-base font-light leading-relaxed max-w-xl mx-auto whitespace-pre-line" data-t="cta.text"></p>
                <button type="button" onclick="toggleContactModal()" class="mt-10 inline-flex items-center justify-center px-10 py-4 text-xs font-bold uppercase tracking-widest text-studio-950 bg-white rounded-full hover:bg-neutral-200 transition">
                    <span data-t="cta.button" data-d="Забронировать дату"></span>
                </button>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer class="border-t editorial-border py-12 bg-studio-950">
        <div class="max-w-7xl mx-auto px-6 flex flex-col md:flex-row items-center justify-between gap-6 text-xs text-neutral-500">
            <div data-t="contacts.footer_text" class="text-center md:text-left"></div>
            <div id="footer-socials" class="flex flex-wrap items-center justify-center gap-x-6 gap-y-3 uppercase tracking-wider"></div>
        </div>
    </footer>

    <!-- Lightbox / carousel -->
    <div id="lightbox-modal" class="fixed inset-0 z-50 bg-black/95 backdrop-blur-lg hidden flex-col items-center justify-center" onclick="if(event.target===this)closeLightbox()">
        <button onclick="closeLightbox()" aria-label="Закрыть" class="absolute top-4 right-4 sm:top-6 sm:right-6 z-10 text-neutral-300 hover:text-white p-2"><i data-lucide="x" class="w-8 h-8"></i></button>
        <div id="lb-counter" class="absolute top-6 left-6 text-xs font-mono text-neutral-400 z-10"></div>
        <div id="lb-viewport" class="relative w-full max-w-6xl overflow-hidden select-none" style="touch-action: pan-y;">
            <div id="lb-track" class="flex transition-transform duration-300 ease-out"></div>
        </div>
        <button id="lb-prev" onclick="lbGo(-1)" aria-label="Назад" class="absolute left-2 sm:left-6 top-1/2 -translate-y-1/2 z-10 w-11 h-11 rounded-full bg-black/50 border editorial-border flex items-center justify-center text-white hover:bg-white hover:text-black transition"><i data-lucide="chevron-left" class="w-5 h-5"></i></button>
        <button id="lb-next" onclick="lbGo(1)" aria-label="Вперёд" class="absolute right-2 sm:right-6 top-1/2 -translate-y-1/2 z-10 w-11 h-11 rounded-full bg-black/50 border editorial-border flex items-center justify-center text-white hover:bg-white hover:text-black transition"><i data-lucide="chevron-right" class="w-5 h-5"></i></button>
        <div class="mt-4 text-center px-6">
            <h3 id="lightbox-title" class="font-syne text-xl font-bold uppercase tracking-wider"></h3>
            <p id="lightbox-desc" class="text-xs font-mono text-neutral-400 mt-1"></p>
            <div id="lb-dots" class="flex justify-center gap-1.5 mt-4"></div>
        </div>
    </div>

    <!-- Contact modal -->
    <div id="contact-modal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-md hidden items-center justify-center p-4" onclick="if(event.target===this)toggleContactModal()">
        <div class="bg-studio-900 border editorial-border rounded-2xl max-w-lg w-full p-6 sm:p-8 relative max-h-full overflow-y-auto">
            <button onclick="toggleContactModal()" aria-label="Закрыть" class="absolute top-5 right-5 text-neutral-400 hover:text-white"><i data-lucide="x" class="w-6 h-6"></i></button>
            <h3 class="font-syne text-2xl font-bold uppercase">Обсудить проект</h3>
            <p class="text-xs text-neutral-400 mt-1 mb-6">Выберите удобный мессенджер — откроется чат со мной и готовым сообщением.</p>
            <form id="booking-form" onsubmit="handleFormSubmit(event)" class="space-y-5">
                <div>
                    <label for="c-name" class="block text-xs font-mono uppercase text-neutral-400 mb-1">Ваше имя</label>
                    <input id="c-name" type="text" required autocomplete="given-name" placeholder="Анна" class="w-full bg-studio-950 border editorial-border rounded-lg p-3 text-base sm:text-sm focus:outline-none focus:border-white transition">
                </div>
                <div>
                    <span class="block text-xs font-mono uppercase text-neutral-400 mb-2">Где вам удобнее общаться</span>
                    <div id="method-buttons" class="grid grid-cols-2 gap-2"></div>
                </div>
                <div>
                    <label for="service-input" class="block text-xs font-mono uppercase text-neutral-400 mb-1">Тип съемки</label>
                    <select id="service-input" class="w-full bg-studio-950 border editorial-border rounded-lg p-3 text-base sm:text-sm focus:outline-none focus:border-white transition"></select>
                </div>
                <div>
                    <label for="c-wishes" class="block text-xs font-mono uppercase text-neutral-400 mb-1">Пожелания</label>
                    <textarea id="c-wishes" rows="3" placeholder="Дата, локация, идеи — всё, что важно" class="w-full bg-studio-950 border editorial-border rounded-lg p-3 text-base sm:text-sm focus:outline-none focus:border-white transition"></textarea>
                </div>
                <button type="submit" class="w-full bg-white text-black font-syne font-bold uppercase py-3.5 rounded-lg text-xs hover:bg-neutral-200 transition">Связаться со мной</button>
                <p id="form-note" class="hidden text-xs text-neutral-400 text-center leading-relaxed"></p>
            </form>
        </div>
    </div>

    <script>
        let SITE = null;
        let activeCat = 'all';

        // Названия блоков в админке → внутренние id секций
        const SECTION_IDS = {
            'Главный экран': 'hero', 'Фото-ряд': 'featured', 'Instagram': 'instagram', 'Галерея': 'gallery',
            'Обо мне': 'about', 'Услуги': 'services', 'Отзывы': 'reviews', 'Призыв к действию': 'cta'
        };
        const DEFAULT_ORDER = ['hero', 'featured', 'instagram', 'gallery', 'about', 'services', 'reviews', 'cta'];

        const $ = (id) => document.getElementById(id);
        const get = (obj, path) => path.split('.').reduce((o, k) => (o == null ? o : o[k]), obj);
        // Все тексты вставляются через textContent — спецсимволы и кавычки ничего не ломают
        function el(tag, cls, text) {
            const e = document.createElement(tag);
            if (cls) e.className = cls;
            if (text != null && text !== '') e.textContent = text;
            return e;
        }
        function icon(name, cls) {
            const i = document.createElement('i');
            i.setAttribute('data-lucide', name);
            i.className = cls;
            return i;
        }
        // Админка сохраняет пути вида /images/uploads/x.jpg — делаем их относительными к папке сайта,
        // чтобы работало и на user.github.io/repo/
        const img = (u) => {
            u = String(u || '').trim();
            if (!u || /^(https?:|data:|blob:|\/\/)/i.test(u)) return u;
            return u.replace(/^\/+/, '').split('/').map(encodeURIComponent).join('/');
        };
        function setImg(node, url) {
            const s = img(url);
            if (s) { node.src = s; return; }
            node.removeAttribute('src');
            const w = node.closest('[data-imgwrap]'); if (w) w.classList.add('hidden');
        }
        const digits = s => String(s || '').replace(/\D/g, '');

        async function init() {
            try {
                const res = await fetch('content/site.json?v=' + Date.now());
                if (!res.ok) throw new Error('bad status');
                SITE = await res.json();
            } catch (e) {
                document.body.prepend(el('p', 'p-6 text-rose-400', 'Не удалось загрузить content/site.json. Откройте сайт через GitHub Pages или локальный сервер.'));
                return;
            }
            ['meta', 'hero', 'instagram', 'about', 'contacts', 'headings', 'cta'].forEach(k => { SITE[k] = SITE[k] || {}; });
            ['featured', 'gallery', 'services', 'reviews', 'categories'].forEach(k => { if (!Array.isArray(SITE[k])) SITE[k] = []; });

            document.title = SITE.meta.title || SITE.meta.brand || '';
            document.querySelectorAll('[data-t]').forEach(n => {
                const v = get(SITE, n.dataset.t) || n.dataset.d || '';
                n.textContent = v;
                n.classList.toggle('hidden', !v);
            });

            const ig = SITE.instagram;
            const igUser = String(ig.username || '').replace('@', '').trim();
            document.querySelectorAll('[data-insta]').forEach(a => { if (igUser) a.href = 'https://www.instagram.com/' + igUser; else a.classList.add('hidden'); });
            document.querySelectorAll('[data-insta-handle]').forEach(n => n.textContent = igUser ? '@' + igUser : '');
            setImg($('insta-avatar'), ig.avatar);
            $('hero-badge').style.display = (SITE.hero.show_badge === false || !SITE.hero.badge) ? 'none' : '';

            renderFeatured(); renderFilters(); renderGallery(); renderAbout(); renderServices();
            const reviewsCount = renderReviews(); renderCta(); renderContact(); renderFooter();
            lucide.createIcons();
            applySections(reviewsCount);
            requestAnimationFrame(updateReviewControls);
        }

        // ---------- Порядок и показ блоков ----------
        function applySections(reviewsCount) {
            const main = $('main');
            const list = Array.isArray(SITE.sections) && SITE.sections.length
                ? SITE.sections
                : DEFAULT_ORDER.map(t => ({ type: t, show: 'Показывать' }));
            const visible = []; const seen = new Set();
            list.forEach(s => {
                const id = SECTION_IDS[s.type] || s.type;
                if (!DEFAULT_ORDER.includes(id) || seen.has(id)) return;
                seen.add(id);
                if (s.show === 'Скрыть') return;
                if (id === 'reviews' && !reviewsCount) return;      // пустой блок отзывов не показываем
                if (id === 'featured' && !SITE.featured.filter(Boolean).length) return;
                visible.push(id);
            });
            DEFAULT_ORDER.forEach(id => $('sec-' + id).classList.add('hidden'));
            visible.forEach(id => { const n = $('sec-' + id); n.classList.remove('hidden'); main.append(n); });
            document.querySelectorAll('[data-nav]').forEach(a => a.classList.toggle('hidden', !visible.includes(a.dataset.nav)));
        }

        // ---------- Featured: 3 фото ----------
        function renderFeatured() {
            const box = $('featured'); box.replaceChildren();
            SITE.featured.filter(Boolean).slice(0, 3).forEach(u => {
                const wrap = el('div', 'group h-96 overflow-hidden rounded-lg border editorial-border');
                const im = el('img', 'photo w-full h-full object-cover'); im.src = img(u); im.alt = ''; im.loading = 'lazy';
                wrap.append(im); box.append(wrap);
            });
        }

        // ---------- Галерея и категории ----------
        const catId = c => (c && (c.id || c.label)) || '';
        function catLabel(id) { const c = SITE.categories.find(c => catId(c) === id); return c ? (c.label || '') : ''; }
        function catsInUse() {
            const used = new Set(SITE.gallery.map(i => i.category).filter(Boolean));
            return SITE.categories.filter(c => catId(c) && used.has(catId(c)));
        }
        function renderFilters() {
            const box = $('filter-buttons'); box.replaceChildren();
            const cats = catsInUse();
            box.classList.toggle('hidden', cats.length === 0);
            if (!cats.length) return;
            if (activeCat !== 'all' && !cats.some(c => catId(c) === activeCat)) activeCat = 'all';
            const mk = (id, label) => {
                const on = id === activeCat;
                const b = el('button', 'filter-btn px-4 py-2 rounded-full border uppercase transition ' +
                    (on ? 'border-white bg-white text-black' : 'editorial-border hover:border-neutral-400'), label);
                b.type = 'button';
                b.onclick = () => { activeCat = id; renderFilters(); renderGallery(); };
                return b;
            };
            box.append(mk('all', SITE.headings.gallery_all || 'Все'), ...cats.map(c => mk(catId(c), c.label || '')));
        }
        function renderGallery() {
            const grid = $('gallery-grid'); grid.replaceChildren();
            SITE.gallery.filter(i => i && i.image && (activeCat === 'all' || i.category === activeCat)).forEach(item => {
                const wrap = el('div', 'relative group h-96 overflow-hidden rounded-lg cursor-pointer border editorial-border');
                wrap.onclick = () => openLightbox(item);
                const im = el('img', 'photo w-full h-full object-cover'); im.src = img(item.image); im.alt = item.title || ''; im.loading = 'lazy';
                wrap.append(im);
                const label = catLabel(item.category);
                if (item.title || label) {
                    wrap.append(el('div', 'absolute inset-0 bg-gradient-to-t from-black/80 via-transparent to-transparent opacity-80 group-hover:opacity-60 transition pointer-events-none'));
                    const foot = el('div', 'absolute bottom-6 left-6 right-6 flex justify-between items-end pointer-events-none');
                    const txt = el('div');
                    if (label) txt.append(el('span', 'block text-[10px] font-mono text-neutral-400 uppercase tracking-wider', label));
                    if (item.title) txt.append(el('h3', 'font-syne text-lg font-bold', item.title));
                    foot.append(txt, icon('maximize-2', 'w-4 h-4 text-neutral-300 opacity-70 group-hover:opacity-100 transition'));
                    wrap.append(foot);
                }
                grid.append(wrap);
            });
            lucide.createIcons();
        }

        function renderAbout() {
            const a = SITE.about;
            setImg($('about-photo'), a.photo);
            const t = $('about-text'); t.replaceChildren();
            (a.text || '').split(/\n\s*\n/).filter(Boolean).forEach(p => t.append(el('p', 'whitespace-pre-line', p.trim())));
            const f = $('about-facts'); f.replaceChildren();
            const facts = (a.facts || []).filter(x => x && (x.label || x.value));
            f.classList.toggle('hidden', !facts.length);
            facts.forEach(x => {
                const d = el('div');
                if (x.label) d.append(el('span', 'text-neutral-500 text-xs font-mono block uppercase', x.label));
                if (x.value) d.append(el('span', 'font-syne text-lg font-bold', x.value));
                f.append(d);
            });
        }

        function renderServices() {
            const list = $('services-list'); list.replaceChildren();
            SITE.services.filter(Boolean).forEach((s, idx) => {
                const row = el('div', 'py-8 grid grid-cols-1 md:grid-cols-12 gap-6 items-center group cursor-pointer hover:bg-white/5 px-4 transition rounded-lg');
                row.onclick = () => toggleContactModal(s.title);
                row.append(el('div', 'md:col-span-1 text-xs font-mono text-neutral-500', String(idx + 1).padStart(2, '0')));
                const c1 = el('div', 'md:col-span-5');
                if (s.title) c1.append(el('h3', 'font-syne text-xl sm:text-2xl font-bold group-hover:translate-x-2 transition', s.title));
                if (s.description) c1.append(el('p', 'text-xs text-neutral-400 mt-1', s.description));
                const c2 = el('div', 'md:col-span-4 text-xs font-mono text-neutral-400');
                (s.bullets || []).filter(Boolean).forEach((b, i) => { if (i) c2.append(document.createElement('br')); c2.append('• ' + b); });
                const c3 = el('div', 'md:col-span-2 md:text-right');
                if (s.price) c3.append(el('span', 'font-syne text-sm font-bold text-neutral-300', s.price));
                row.append(c1, c2, c3); list.append(row);
            });
        }

        // ---------- Отзывы ----------
        // Фото-отзывы: у каждого своя ширина (по пропорциям фото), высота одинаковая
        function reviewUrls() {
            return SITE.reviews.map(r => typeof r === 'string' ? r : (r && r.image)).filter(Boolean).slice(0, 25);
        }
        function renderReviews() {
            const urls = reviewUrls();
            const track = $('rv-track'); track.replaceChildren();
            urls.forEach((u, i) => {
                const card = el('button', 'snap-start shrink-0 block h-52 sm:h-72 lg:h-[26rem] rounded-xl overflow-hidden border editorial-border bg-studio-900 cursor-zoom-in');
                card.type = 'button'; card.setAttribute('aria-label', 'Открыть отзыв ' + (i + 1));
                card.onclick = () => openViewer({ photos: urls, start: i, title: SITE.headings.reviews_title || '', tall: true });
                const im = el('img', 'block h-full w-auto max-w-none');
                im.src = img(u); im.alt = 'Отзыв ' + (i + 1); im.loading = 'lazy'; im.draggable = false;
                im.style.aspectRatio = 'auto 9 / 16'; // пока фото грузится, занимает место вертикальной карточки
                im.addEventListener('load', updateReviewControls);
                card.append(im); track.append(card);
            });
            return urls.length;
        }

        // ---------- CTA: фон и затемнение ----------
        function renderCta() {
            const c = SITE.cta, bg = img(c.background), wrap = $('cta-bg');
            wrap.classList.toggle('hidden', !bg);
            if (!bg) return;
            $('cta-img').src = bg;
            const raw = c.overlay;
            let o = (raw === undefined || raw === null || raw === '') ? 60 : Number(raw);
            if (!isFinite(o)) o = 60;
            o = Math.max(0, Math.min(100, o));
            $('cta-shade').style.background = 'rgba(5,5,5,' + (o / 100) + ')';
            const p = $('cta-text'); p.classList.remove('text-neutral-400'); p.classList.add('text-neutral-200');
        }
        function updateReviewControls() {
            const t = $('rv-track');
            $('rv-controls').classList.toggle('hidden', !(t.scrollWidth > t.clientWidth + 4));
        }
        function rvScroll(dir) { const t = $('rv-track'); t.scrollBy({ left: dir * t.clientWidth * 0.8, behavior: 'smooth' }); }
        window.addEventListener('resize', updateReviewControls);

        // ---------- Футер: соцсети ----------
        function renderFooter() {
            const c = SITE.contacts;
            const tg = String(c.telegram_username || '').replace('@', '').trim();
            const ig = String(SITE.instagram.username || '').replace('@', '').trim();
            const wa = digits(c.whatsapp_phone), vb = digits(c.viber_phone);
            const links = [
                tg && { label: 'Telegram', icon: 'send', href: 'https://t.me/' + tg },
                ig && { label: 'Instagram', icon: 'instagram', href: 'https://www.instagram.com/' + ig },
                wa && { label: 'WhatsApp', icon: 'message-circle', href: 'https://wa.me/' + wa },
                vb && { label: 'Viber', icon: 'phone', href: 'viber://chat?number=%2B' + vb }
            ].filter(Boolean);
            const box = $('footer-socials'); box.replaceChildren();
            links.forEach(l => {
                const a = el('a', 'hover:text-white transition flex items-center gap-1.5');
                a.href = l.href; a.rel = 'noopener';
                if (l.href.startsWith('http')) a.target = '_blank';
                a.append(icon(l.icon, 'w-3.5 h-3.5'), el('span', null, l.label));
                box.append(a);
            });
        }

        // ---------- Карусель фото ----------
        let lbSlides = 0, lbIndex = 0;
        // Карточка галереи: обложка + любое количество доп. фото + последний слайд со ссылкой на Instagram
        function openLightbox(item) {
            openViewer({ photos: [item.image, ...(item.photos || [])], title: item.title || '', desc: item.desc || '', instagram: true });
        }
        // Универсальный просмотр: o = { photos, start, title, desc, instagram, tall }
        function openViewer(o) {
            const photos = (o.photos || []).filter(Boolean);
            const igUser = o.instagram ? String(SITE.instagram.username || '').replace('@', '').trim() : '';
            const track = $('lb-track'); track.replaceChildren();
            photos.forEach((u, i) => {
                const s = el('div', 'shrink-0 w-full flex items-center justify-center px-4 sm:px-16');
                const im = el('img', (o.tall ? 'max-h-[78vh]' : 'max-h-[70vh]') + ' w-auto max-w-full object-contain rounded-sm shadow-2xl');
                im.src = img(u); im.alt = (o.title || '') + ' ' + (i + 1); im.draggable = false; im.loading = 'lazy';
                s.append(im); track.append(s);
            });
            if (igUser) { // последний слайд: ссылка на Instagram
                const cta = el('div', 'shrink-0 w-full flex items-center justify-center px-4 sm:px-16');
                const box = el('div', 'h-[50vh] flex flex-col items-center justify-center text-center gap-5');
                const a = document.createElement('a');
                a.href = 'https://www.instagram.com/' + igUser; a.target = '_blank'; a.rel = 'noopener';
                a.className = 'bg-white text-black text-xs font-bold px-8 py-4 rounded-full uppercase tracking-wider hover:bg-neutral-200 transition flex items-center gap-2';
                a.append(icon('instagram', 'w-4 h-4'), el('span', null, SITE.instagram.more_button || 'Больше фото в Instagram'));
                const nick = el('p', 'font-syne text-2xl sm:text-3xl font-bold uppercase flex items-center justify-center gap-3');
                nick.append(icon('instagram', 'w-7 h-7 shrink-0'), el('span', null, '@' + igUser));
                box.append(nick, a);
                cta.append(box); track.append(cta);
            }
            lbSlides = track.children.length; lbIndex = 0;
            const dots = $('lb-dots'); dots.replaceChildren();
            if (lbSlides <= 14) { // при большом количестве фото точки не нужны — есть счётчик
                for (let i = 0; i < lbSlides; i++) {
                    const d = el('button', 'w-1.5 h-1.5 rounded-full bg-neutral-600 transition'); d.setAttribute('aria-label', 'Слайд ' + (i + 1));
                    d.onclick = () => lbShow(i); dots.append(d);
                }
            }
            $('lightbox-title').textContent = o.title || '';
            $('lightbox-desc').textContent = o.desc || '';
            const m = $('lightbox-modal'); m.classList.remove('hidden'); m.classList.add('flex');
            document.body.style.overflow = 'hidden';
            lucide.createIcons(); lbShow(o.start || 0);
        }
        function lbShow(i) {
            lbIndex = Math.max(0, Math.min(lbSlides - 1, i));
            $('lb-track').style.transform = 'translateX(' + (-100 * lbIndex) + '%)';
            $('lb-counter').textContent = (lbIndex + 1) + ' / ' + lbSlides;
            document.querySelectorAll('#lb-dots button').forEach((d, k) => { d.classList.toggle('bg-white', k === lbIndex); d.classList.toggle('bg-neutral-600', k !== lbIndex); });
            $('lb-prev').style.visibility = lbIndex === 0 ? 'hidden' : 'visible';
            $('lb-next').style.visibility = lbIndex === lbSlides - 1 ? 'hidden' : 'visible';
        }
        function lbGo(d) { lbShow(lbIndex + d); }
        function closeLightbox() {
            const m = $('lightbox-modal'); m.classList.add('hidden'); m.classList.remove('flex');
            document.body.style.overflow = '';
        }
        (function () { // свайп
            const vp = $('lb-viewport'); let x0 = null;
            vp.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; }, { passive: true });
            vp.addEventListener('touchend', e => { if (x0 === null) return; const dx = e.changedTouches[0].clientX - x0; if (Math.abs(dx) > 40) lbGo(dx < 0 ? 1 : -1); x0 = null; });
        })();

        function toggleContactModal(preset) {
            const m = $('contact-modal');
            const sel = $('service-input');
            if (typeof preset === 'string' && preset && [...sel.options].some(o => o.value === preset)) sel.value = preset;
            $('form-note').classList.add('hidden');
            m.classList.toggle('hidden'); m.classList.toggle('flex');
        }
        document.addEventListener('keydown', e => {
            const lb = !$('lightbox-modal').classList.contains('hidden');
            if (e.key === 'Escape') { closeLightbox(); const m = $('contact-modal'); if (!m.classList.contains('hidden')) toggleContactModal(); }
            if (lb && e.key === 'ArrowRight') lbGo(1);
            if (lb && e.key === 'ArrowLeft') lbGo(-1);
        });

        // ---------- Попап «Связаться» ----------
        function methods() {
            const c = SITE.contacts;
            return {
                telegram:  { label: 'Telegram',  icon: 'send',           target: String(c.telegram_username || '').replace('@', '').trim(), url: (t, m) => 'https://t.me/' + t + '?text=' + encodeURIComponent(m), copy: false },
                whatsapp:  { label: 'WhatsApp',  icon: 'message-circle', target: digits(c.whatsapp_phone), url: (t, m) => 'https://wa.me/' + t + '?text=' + encodeURIComponent(m), copy: false },
                viber:     { label: 'Viber',     icon: 'phone',          target: digits(c.viber_phone),    url: (t) => 'viber://chat?number=%2B' + t, copy: true, scheme: true },
                instagram: { label: 'Instagram', icon: 'instagram',      target: String(SITE.instagram.username || '').replace('@', '').trim(), url: (t) => 'https://ig.me/m/' + t, copy: true }
            };
        }
        let selectedMethod = null;
        function selectMethod(key) {
            selectedMethod = key;
            document.querySelectorAll('#method-buttons button').forEach(b => {
                const on = b.dataset.key === key;
                b.classList.toggle('bg-white', on); b.classList.toggle('text-black', on);
                b.classList.toggle('editorial-border', !on); b.classList.toggle('border-white', on);
                b.setAttribute('aria-pressed', on);
            });
        }
        function renderContact() {
            const sel = $('service-input'); sel.replaceChildren();
            [...SITE.services.filter(s => s && s.title).map(s => s.title), 'Другое'].forEach(t => { const o = el('option', null, t); o.value = t; sel.append(o); });
            const box = $('method-buttons'); box.replaceChildren();
            const m = methods(); const avail = Object.keys(m).filter(k => m[k].target);
            avail.forEach(k => {
                const b = el('button', 'flex items-center justify-center gap-2 px-3 py-3 rounded-lg border editorial-border text-xs font-mono uppercase hover:border-neutral-400 transition');
                b.type = 'button'; b.dataset.key = k; b.onclick = () => selectMethod(k);
                b.append(icon(m[k].icon, 'w-4 h-4'), el('span', null, m[k].label)); box.append(b);
            });
            if (avail.length) selectMethod(avail[0]);
        }
        function copyText(text) {
            try {
                if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(text).catch(() => {}); return; }
            } catch (e) {}
            try { const t = document.createElement('textarea'); t.value = text; t.style.position = 'fixed'; t.style.opacity = '0'; document.body.append(t); t.select(); document.execCommand('copy'); t.remove(); } catch (e) {}
        }
        function handleFormSubmit(e) {
            e.preventDefault();
            const note = $('form-note'); note.classList.remove('hidden');
            const m = methods()[selectedMethod];
            if (!m || !m.target) { note.textContent = 'Способы связи пока не настроены. Напишите мне в Instagram.'; return; }
            const tpl = SITE.contacts.message_template || 'Здравствуйте! Меня зовут {name}. Хочу заказать съёмку: {type}.\nПожелания: {wishes}';
            const msg = tpl
                .replaceAll('{name}', $('c-name').value.trim())
                .replaceAll('{type}', $('service-input').value)
                .replaceAll('{wishes}', $('c-wishes').value.trim() || '—');
            if (m.copy) copyText(msg); // буфер обмена нужно заполнить сразу по клику, до открытия чата
            const url = m.url(m.target, msg);
            if (m.scheme) window.location.href = url; else if (!window.open(url, '_blank')) window.location.href = url;
            note.textContent = m.copy
                ? 'Текст сообщения скопирован — вставьте его в открывшийся чат и отправьте.'
                : 'Открываем чат — осталось нажать «Отправить».';
        }

        init();
    </script>
</body>
</html>
